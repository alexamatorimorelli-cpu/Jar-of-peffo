<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le cose che non volevo dimenticare</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Courier New",monospace;color:#2e2927}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 18% 15%,#ffe9ad 0 4%,transparent 19%),
    radial-gradient(circle at 83% 23%,#d9a4aa 0 3%,transparent 17%),
    radial-gradient(circle at 52% 58%,#7faeaa 0 2%,transparent 24%),
    linear-gradient(180deg,#182b48 0%,#29465a 32%,#3f6664 60%,#81907b 82%,#c6a47b 100%);
  overflow-x:hidden;
}
.page{min-height:100vh;position:relative;padding:28px 18px 42px;text-align:center}
.paper{
  position:absolute;left:-5%;right:-5%;top:51%;height:38%;
  background:#5c827e;
  opacity:.62;
  transform:rotate(-1deg);
  z-index:0;
  clip-path:polygon(0 7%,4% 5%,8% 8%,13% 4%,18% 7%,24% 3%,30% 7%,36% 4%,43% 7%,50% 3%,58% 6%,64% 4%,71% 7%,77% 3%,84% 6%,91% 4%,100% 7%,100% 93%,95% 91%,90% 94%,83% 91%,76% 95%,69% 92%,62% 95%,55% 91%,48% 94%,40% 91%,33% 95%,26% 92%,19% 94%,12% 91%,5% 94%,0 91%);
}
/* tiny enchanted-forest details */
.ground-details{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.grass{position:absolute;width:3px;height:20px;border-radius:100% 0 100% 0;background:#526b50;transform-origin:bottom}
.g1{left:29%;bottom:15%;transform:rotate(-22deg)}.g2{left:70%;bottom:14%;transform:rotate(25deg)}.g3{left:78%;bottom:17%;height:15px;transform:rotate(-12deg)}
.leaf{position:absolute;width:17px;height:8px;border-radius:100% 0 100% 0;background:#71875e;opacity:.8}
.l1{left:21%;bottom:14%;transform:rotate(25deg)}.l2{right:20%;bottom:12%;transform:rotate(-30deg)}
.mushroom{position:absolute;width:17px;height:13px;border-radius:60% 60% 35% 35%;background:#bd7563;bottom:13%;z-index:2}
.mushroom:after{content:"";position:absolute;width:5px;height:11px;left:6px;top:9px;background:#e8d8b9;border-radius:0 0 4px 4px}
.mushroom i,.mushroom i:before,.mushroom i:after{position:absolute;width:3px;height:3px;border-radius:50%;background:#f2d99e;content:""}
.mushroom i{left:4px;top:4px}.mushroom i:before{left:7px;top:2px}.mushroom i:after{left:3px;top:-2px}
.m1{left:24%;transform:scale(.75)}.m2{right:23%;transform:scale(.55)}
.firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:#f6d77e;box-shadow:0 0 10px #ffe59a;animation:twinkle 3.2s ease-in-out infinite}
.f1{left:24%;bottom:28%}.f2{right:26%;bottom:33%;animation-delay:1.1s}.f3{left:73%;bottom:25%;animation-delay:2s}

/* a soft glass response when a Nerino is hovered */
.jar{transition:filter .3s ease}
.jar:has(.nerino:hover){filter:drop-shadow(0 15px 25px #142b2c55) drop-shadow(0 0 13px #ffe1a322)}

/* cozy enchanted-fantasy atmosphere */
.fantasy-sky{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fantasy-moon{
  position:absolute;right:9%;top:8%;width:58px;height:58px;border-radius:50%;
  background:#ffe9b0;box-shadow:0 0 28px #ffd98a88,0 0 70px #ffe7b044;
}
.cloud{position:absolute;border-radius:50%;filter:blur(1px);opacity:.2;background:#d8e1d9}
.cloud-a{width:170px;height:35px;right:-25px;top:15%}
.cloud-b{width:130px;height:25px;left:-30px;top:27%}
.spark{
  position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe7a0;
  box-shadow:0 0 8px #ffe2a0;animation:twinkle 3.5s ease-in-out infinite;
}
.sp1{left:11%;top:12%}.sp2{left:31%;top:20%;animation-delay:.8s}
.sp3{left:67%;top:17%;animation-delay:1.5s}.sp4{left:85%;top:29%;animation-delay:2.2s}
.sp5{left:19%;top:38%;animation-delay:1.1s}.sp6{left:75%;top:42%;animation-delay:2.7s}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.5)}}
.distant-trees{
  position:absolute;bottom:24%;height:180px;width:115%;
  left:-7%;opacity:.45;
  background:
    radial-gradient(ellipse at 8% 82%,#254b4c 0 11%,transparent 12%),
    radial-gradient(ellipse at 20% 68%,#2b5550 0 15%,transparent 16%),
    radial-gradient(ellipse at 35% 79%,#25494a 0 12%,transparent 13%),
    radial-gradient(ellipse at 51% 61%,#2c5752 0 17%,transparent 18%),
    radial-gradient(ellipse at 68% 76%,#24494a 0 14%,transparent 15%),
    radial-gradient(ellipse at 84% 64%,#2a5350 0 16%,transparent 17%),
    radial-gradient(ellipse at 98% 78%,#234447 0 13%,transparent 14%);
}
.trees-a{transform:scale(1.08);filter:blur(1px)}
.trees-b{bottom:19%;opacity:.27;transform:scale(1.2);filter:blur(3px)}
.ground-mist{
  position:absolute;left:-10%;right:-10%;bottom:13%;height:100px;
  background:radial-gradient(ellipse at center,#dbe4d69c 0 12%,transparent 68%);
  filter:blur(10px);
}
@keyframes mist{0%,100%{transform:translateX(-2%)}50%{transform:translateX(2%)}}

h1{
  position:relative;z-index:3;
  margin:0 auto 8px;max-width:680px;
  font-family:Georgia,serif;font-weight:400;
  font-size:clamp(29px,7vw,45px);line-height:1.05;color:#f3cf78;
}
.subtitle{
  position:relative;z-index:3;
  margin:0 0 19px;font-family:Georgia,serif;
  color:#f0d28b;font-size:17px;
}
.controls{
  position:relative;z-index:4;
  display:flex;flex-direction:column;align-items:flex-end;
  gap:10px;width:min(310px,88vw);margin:0 auto 12px;
}
.control{
  border:0;padding:9px 17px 10px;
  color:#49351f;background:#d9b47a;
  font:16px "Courier New",monospace;
  box-shadow:2px 3px 0 #8d6e52;
  clip-path:polygon(2% 8%,98% 0,100% 89%,3% 100%);
  cursor:pointer;
}
.control:hover{transform:rotate(-.5deg)}
.jar-title{
  position:relative;z-index:2;
  margin:7px 0 2px;font-family:Georgia,serif;
  font-size:27px;color:#efc96f;
}
.counter{position:relative;z-index:2;font-size:16px;margin-bottom:8px;color:#efd18a}

/* soft soot around the jar */
.soot{
  position:absolute;z-index:1;border-radius:50%;
  background:#171514;opacity:.38;filter:blur(1px);
  box-shadow:0 0 5px #17151444;
  pointer-events:none;
}
.soot-a{width:8px;height:8px;left:22%;bottom:77px;box-shadow:18px 9px 0 1px #17151455,34px 1px 0 -1px #17151444,48px 13px 0 2px #17151433}
.soot-b{width:5px;height:5px;right:20%;bottom:94px;box-shadow:-14px 8px 0 1px #17151444,-28px 18px 0 -1px #17151455}
.soot-c{width:11px;height:7px;left:31%;bottom:59px;opacity:.25;transform:rotate(-12deg);box-shadow:30px 4px 0 -2px #17151455,-18px 9px 0 -3px #17151444}
.soot:after{
  content:"";position:absolute;width:4px;height:4px;border-radius:50%;
  background:#171514;left:50%;top:-11px;box-shadow:11px -7px 0 -1px #17151488;
}
@keyframes sootFloat{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-3px) rotate(2deg)}
}
.soot-a{animation:sootFloat 5s ease-in-out infinite}
.soot-b{animation:sootFloat 6s ease-in-out .8s infinite}
.soot-c{animation:sootFloat 5.5s ease-in-out 1.4s infinite}

/* illustrated jar */
.jar-wrap{
  position:relative;z-index:2;
  width:min(390px,94vw);height:570px;
  margin:0 auto;
}
.jar{
  position:absolute;left:50%;top:8px;transform:translateX(-50%);
  width:min(320px,78vw);height:500px;
  filter:drop-shadow(0 15px 22px #142b2c44);
}
.jar-shadow{
  position:absolute;left:5%;right:5%;bottom:13px;height:30px;
  background:#6c543f2a;border-radius:50%;filter:blur(8px);
}
.jar-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.jar-body{fill:url(#glass);stroke:#77716b;stroke-width:2.5}
.glass-line{fill:none;stroke:#fff;stroke-opacity:.62;stroke-width:4;stroke-linecap:round}
.glass-soft{fill:none;stroke:#77716b;stroke-opacity:.23;stroke-width:7}
.lid-main{fill:#a79a89;stroke:#74695e;stroke-width:2}
.lid-ridge{fill:none;stroke:#665d54;stroke-width:2}
.lid-shine{fill:none;stroke:#eee7dc;stroke-width:3;opacity:.7}

/* memories live in the jar */
.memories{position:absolute;left:50%;top:94px;transform:translateX(-50%);width:235px;height:365px;z-index:5}
.nerino{
  position:absolute;width:48px;height:52px;border:0;background:none;padding:0;
  cursor:pointer;filter:drop-shadow(0 2px 2px #4b382733);
  transition:.2s;
}
.nerino{animation:floatNerino 4.2s ease-in-out infinite;animation-delay:var(--delay,0s)}
.nerino:hover{animation-play-state:paused;transform:translateY(-5px) scale(1.08) rotate(-4deg)}
.nerino:hover .star{filter:drop-shadow(0 0 8px #ffe6a8) drop-shadow(0 0 15px #ffe6a855)}
.nerino:hover:after{
  content:"";position:absolute;left:58%;top:20%;width:15px;height:5px;
  border-radius:100%;background:#fff9d966;transform:rotate(-28deg);filter:blur(1px);
}
@keyframes floatNerino{
  0%,100%{margin-top:0;transform:rotate(var(--rot,0deg))}
  50%{margin-top:-7px;transform:rotate(calc(var(--rot,0deg) + 2deg))}
}
.nerino svg{width:100%;height:100%;overflow:visible}
.fur{fill:#111;stroke:#090909;stroke-width:1}
.eye{fill:#fff;stroke:#090909;stroke-width:1}.pupil{fill:#231d1a}
.limb{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.star{stroke:#9b7b45;stroke-width:1;filter:drop-shadow(0 0 5px #ffe3a0)}
.n1{--rot:-8deg;--delay:.1s;left:4%;top:8%;}
.n2{--rot:5deg;--delay:.8s;left:38%;top:3%;}
.n3{--rot:-5deg;--delay:1.4s;left:70%;top:15%;}
.n4{--rot:7deg;--delay:2.1s;left:18%;top:38%;}
.n5{--rot:-7deg;--delay:2.8s;left:48%;top:34%;}
.n6{--rot:6deg;--delay:1.7s;left:71%;top:49%;}
.n7{--rot:-5deg;--delay:3.2s;left:5%;top:61%;}
.n8{--rot:4deg;--delay:2.4s;left:39%;top:63%;}

.add{
  position:relative;z-index:5;
  border:0;background:#d6a85f;color:#4b302b;
  font:16px "Courier New",monospace;
  padding:11px 20px;box-shadow:2px 3px 0 #a06b45;
  clip-path:polygon(2% 8%,98% 0,100% 90%,3% 100%);
  cursor:pointer;
}
.hint{position:relative;z-index:2;margin:13px 0 0;color:#746b64;font-size:13px}

dialog{
  width:min(460px,92vw);border:0;border-radius:8px;
  background:#fffaf0;color:#3d342f;padding:0;
  box-shadow:0 25px 80px #0005;
}
dialog::backdrop{background:#211b1766}
.card{padding:26px}
.card h2{font-family:Georgia,serif;font-weight:400;margin:0 0 16px;font-size:23px}
textarea{
  width:100%;min-height:170px;border:1px solid #d6c6ae;
  border-radius:5px;background:#fffdf8;padding:13px;
  font:17px/1.5 Georgia,serif;resize:vertical;outline:none;
}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.cancel{border:0;background:none;padding:10px;font:15px "Courier New",monospace}
.save{border:0;background:#d1aa70;padding:10px 16px;font:15px "Courier New",monospace;cursor:pointer}
.memory-text{font:20px/1.6 Georgia,serif;white-space:pre-wrap;text-align:center}
.close{display:block;margin:18px auto 0}
</style>
</head>

<body>
<main class="page">
  <div class="ground-details" aria-hidden="true">
  <span class="grass g1"></span><span class="grass g2"></span><span class="grass g3"></span>
  <span class="leaf l1"></span><span class="leaf l2"></span>
  <span class="mushroom m1"><i></i></span><span class="mushroom m2"><i></i></span>
  <span class="firefly f1"></span><span class="firefly f2"></span><span class="firefly f3"></span>
</div>
<div class="fantasy-sky" aria-hidden="true">
    <span class="fantasy-moon"></span>
    <span class="cloud cloud-a"></span><span class="cloud cloud-b"></span>
    <i class="spark sp1"></i><i class="spark sp2"></i><i class="spark sp3"></i>
    <i class="spark sp4"></i><i class="spark sp5"></i><i class="spark sp6"></i>
    <div class="distant-trees trees-a"></div>
    <div class="distant-trees trees-b"></div>
    <div class="ground-mist"></div>
  </div>
  <div class="paper"></div>

  <h1>Le cose che non volevo<br>dimenticare</h1>
  <div class="subtitle">Piccole cose. Grandi ricordi.</div>

  <div class="controls">
    <button class="control" id="topAdd">＋ lascia un ricordo</button>
    <button class="control" id="viewAll">★ guarda tutti i ricordi</button>
  </div>

  <div class="jar-title">il barattolo dei ricordi</div>
  <div class="counter" id="counter">nessun ricordo ancora.</div>

  <section class="jar-wrap">
    <div class="soot soot-a"></div><div class="soot soot-b"></div><div class="soot soot-c"></div>
    <div class="jar-shadow"></div>
    <div class="jar">
      <svg class="jar-svg" viewBox="0 0 320 500" aria-hidden="true">
        <defs>
          <linearGradient id="glass" x1="0" x2="1">
            <stop offset="0" stop-color="#dfe7e3" stop-opacity=".34"/>
            <stop offset=".18" stop-color="#fff" stop-opacity=".14"/>
            <stop offset=".52" stop-color="#fff" stop-opacity=".05"/>
            <stop offset=".82" stop-color="#dce8e4" stop-opacity=".18"/>
            <stop offset="1" stop-color="#aebcb9" stop-opacity=".3"/>
          </linearGradient>
          <linearGradient id="lid" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#c5baaa"/>
            <stop offset=".5" stop-color="#918476"/>
            <stop offset="1" stop-color="#b4a796"/>
          </linearGradient>
        </defs>

        <!-- lid -->
        <rect x="50" y="17" width="220" height="43" rx="10" fill="url(#lid)" stroke="#70665d" stroke-width="2"/>
        <path class="lid-ridge" d="M57 25H263 M57 33H263 M57 41H263 M57 49H263"/>
        <path class="lid-shine" d="M70 22H244"/>

        <!-- jar rim -->
        <path class="jar-body" d="M55 57
          C55 48 68 43 80 43 H240
          C252 43 265 48 265 57
          L270 85
          C273 102 279 111 279 128
          V426
          C279 460 260 483 225 490
          C190 497 130 497 95 490
          C60 483 41 460 41 426
          V128
          C41 111 47 102 50 85 Z"/>
        <path class="glass-soft" d="M56 122 C51 180 53 385 59 430 C64 462 83 475 105 481"/>
        <path class="glass-soft" d="M265 122 C270 190 267 395 260 432"/>
        <path class="glass-line" d="M67 105 C58 155 61 392 71 433"/>
        <path class="glass-line" d="M247 108 C260 170 256 380 248 431" opacity=".25"/>
        <path class="glass-line" d="M82 473 C126 487 196 487 238 472" opacity=".4"/>
      </svg>
      <div class="memories" id="memories"></div>
    </div>
  </section>

  <button class="add" id="add">＋ lascia un ricordo</button>
  <div class="hint">clicca un Nerino per leggere ciò che hai scritto</div>
</main>

<dialog id="addDialog">
<form class="card" id="addForm">
  <h2>Una cosa che non volevo dimenticare…</h2>
  <textarea id="text" maxlength="1600" placeholder="Scrivi qui…"></textarea>
  <div class="actions">
    <button type="button" class="cancel" id="cancel">annulla</button>
    <button class="save">★ conserva</button>
  </div>
</form>
</dialog>

<dialog id="viewDialog">
<div class="card">
  <h2>Un piccolo ricordo</h2>
  <div class="memory-text" id="memoryText"></div>
  <div class="actions" style="justify-content:center">
    <button class="cancel" id="deleteMemory">elimina questo ricordo</button>
    <button class="save" id="closeView">chiudi</button>
  </div>
</div>
</dialog>

<dialog id="allDialog">
<div class="card">
  <h2>Tutti i ricordi</h2>
  <div id="allText" class="memory-text"></div>
  <button class="save close" id="closeAll">chiudi</button>
</div>
</dialog>

<script>
const KEY="nerini-demo";
const memories=JSON.parse(localStorage.getItem(KEY)||"[]");
const colors=["#e7a94d","#d96b62","#8fbdb3","#f2d38b","#c9828e","#9fc8c4"];
let selectedMemoryIndex=-1;

function nerinoSVG(i){
  const c=colors[i%colors.length];
  const q=[
   {fur:"M38 18C31 16 26 21 27 27C20 29 20 36 25 40C20 46 26 53 32 52C36 59 45 57 48 52C56 54 60 47 56 42C62 36 57 29 52 29C51 22 45 18 38 18Z",e1:[32,35],e2:[44,34],star:"M54 17"},
   {fur:"M39 18C32 20 29 24 29 29C22 29 21 36 26 40C22 46 27 52 33 51C35 58 44 59 48 53C55 55 60 49 56 44C62 39 57 32 53 31C53 24 46 18 39 18Z",e1:[32,36],e2:[45,38],star:"M55 18"},
   {fur:"M39 19C32 17 27 22 29 29C22 32 23 38 27 41C23 48 29 53 35 52C39 58 47 56 50 51C57 52 60 45 56 41C60 34 54 29 50 29C49 23 45 19 39 19Z",e1:[32,37],e2:[44,37],star:"M54 15"}
  ][i%3];
  return `<svg viewBox="0 0 68 74">
    <path class="limb" d="M27 43Q17 39 10 31M49 43Q57 37 61 29M31 52Q26 61 20 65M45 52Q50 61 56 64"/>
    <path class="fur" d="${q.fur}"/>
    <circle class="fur" cx="25" cy="25" r="4.5"/><circle class="fur" cx="51" cy="24" r="4.5"/>
    <circle class="fur" cx="31" cy="20" r="3.5"/><circle class="fur" cx="46" cy="19" r="3.5"/>
    <ellipse class="eye" cx="${q.e1[0]}" cy="${q.e1[1]}" rx="5" ry="6.5"/>
    <ellipse class="eye" cx="${q.e2[0]}" cy="${q.e2[1]}" rx="5" ry="6.5"/>
    <circle class="pupil" cx="${q.e1[0]+1}" cy="${q.e1[1]}" r="2"/>
    <circle class="pupil" cx="${q.e2[0]-1}" cy="${q.e2[1]-1}" r="2"/>
    <path class="limb" d="M29 46Q36 50 44 46"/>
    <path class="star" fill="${c}" d="${q.star}l3 6 6.8 .8-5 4.7 1.4 6.5-6.2-3.5-6.2 3.5 1.4-6.5-5-4.7 6.8-.8z"/>
  </svg>`;
}

function render(){
  const box=document.getElementById("memories");
  box.innerHTML="";
  const positions = [
    [4,8,-8],[39,4,5],[70,14,-5],
    [18,27,7],[49,28,-7],[73,34,6],
    [4,46,-5],[35,46,4],[60,48,-6],
    [20,61,5],[47,61,-5],[76,60,7],
    [8,76,-4],[38,77,6],[65,75,-7]
  ];
  memories.forEach((m,i)=>{
    const b=document.createElement("button");
    b.className="nerino";
    const pos=positions[i % positions.length];
    b.style.left=pos[0]+"%";
    b.style.top=pos[1]+"%";
    b.style.setProperty("--rot",pos[2]+"deg");
    b.style.setProperty("--delay",(i*0.37%3.5).toFixed(2)+"s");
    b.title="Apri ricordo";
    b.innerHTML=nerinoSVG(i);
    b.onclick=()=>{
      selectedMemoryIndex=i;
      document.getElementById("memoryText").textContent=m;
      document.getElementById("viewDialog").showModal();
    };
    box.appendChild(b);
  });
  const n=memories.length;
  document.getElementById("counter").textContent =
    n===0 ? "nessun ricordo ancora." : n===1 ? "1 ricordo conservato." : n+" ricordi conservati.";
}
function openAdd(){
  document.getElementById("text").value="";
  document.getElementById("addDialog").showModal();
  setTimeout(()=>document.getElementById("text").focus(),80);
}
document.getElementById("add").onclick=openAdd;
document.getElementById("topAdd").onclick=openAdd;
document.getElementById("cancel").onclick=()=>document.getElementById("addDialog").close();
document.getElementById("closeView").onclick=()=>document.getElementById("viewDialog").close();
document.getElementById("deleteMemory").onclick=()=>{
  if(selectedMemoryIndex<0)return;
  if(confirm("Sicura di voler eliminare questo ricordo?")){
    memories.splice(selectedMemoryIndex,1);
    localStorage.setItem(KEY,JSON.stringify(memories));
    selectedMemoryIndex=-1;
    document.getElementById("viewDialog").close();
    render();
  }
};
document.getElementById("closeAll").onclick=()=>document.getElementById("allDialog").close();

document.getElementById("addForm").onsubmit=e=>{
  e.preventDefault();
  const v=document.getElementById("text").value.trim();
  if(!v)return;
  memories.push(v);
  localStorage.setItem(KEY,JSON.stringify(memories));
  document.getElementById("addDialog").close();
  render();
};

document.getElementById("viewAll").onclick=()=>{
  const el=document.getElementById("allText");
  el.innerHTML=memories.length
    ? memories.map((m,i)=>`<div style="margin-bottom:18px"><b>★ ${i+1}</b><br>${m.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>`).join("")
    : "Non hai ancora lasciato nessun ricordo.";
  document.getElementById("allDialog").showModal();
};


render();
</script>
</body>
</html>
