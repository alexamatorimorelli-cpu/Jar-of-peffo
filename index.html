<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le cose che non volevo dimenticare</title>
<style>
*{box-sizing:border-box} html,body{margin:0;min-height:100%}
body{font-family:Georgia,"Times New Roman",serif;color:#44362f;background:#17283b}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(#14243a,#273c49 45%,#6f5a49);z-index:-2}
.wrap{min-height:100vh;padding:30px 14px 44px;display:flex;flex-direction:column;align-items:center}
h1{margin:0;text-align:center;color:#fff0cd;font-size:clamp(31px,8vw,56px);font-weight:400;line-height:1.04;text-shadow:0 3px 18px #050b13}
.subtitle{color:#f7e5c3;text-align:center;font-size:16px;margin:10px 0 20px}
.scene{width:min(650px,100%);position:relative;border-radius:34px;overflow:hidden;box-shadow:0 22px 70px #080b0f99}
.scene img{display:block;width:100%;height:auto}
.hotspot{position:absolute;width:15%;aspect-ratio:1;border:0;background:transparent;border-radius:50%;cursor:pointer;filter:drop-shadow(0 0 10px transparent)}
.hotspot:hover{filter:drop-shadow(0 0 14px #ffe7a0)}
/* approximate clickable nerini positions in the illustrated jar */
.h1{left:35%;top:37%}.h2{left:48%;top:30%}.h3{left:63%;top:42%}.h4{left:42%;top:52%}
.h5{left:56%;top:58%}.h6{left:68%;top:62%}.h7{left:29%;top:65%}.h8{left:51%;top:72%}
.panel{margin-top:20px;width:min(650px,100%);display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.add{border:0;border-radius:999px;padding:13px 22px;background:#f6e4c0;color:#4b3b31;font:17px Georgia,serif;box-shadow:0 8px 22px #090c1099;cursor:pointer}
.count{color:#f8e8c8;font-size:14px;text-align:center;margin-top:10px}
dialog{width:min(470px,92vw);border:0;border-radius:24px;background:#f8edd8;color:#44362f;padding:0;box-shadow:0 30px 100px #000b}
dialog::backdrop{background:#07111dcc;backdrop-filter:blur(4px)}
.card{padding:26px}.card h2{text-align:center;font-weight:400;margin:0 0 17px}
textarea{width:100%;min-height:170px;border:1px solid #d4bea0;border-radius:15px;background:#fffaf0;padding:14px;font:18px/1.55 Georgia,serif;resize:vertical;outline:0}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.cancel{border:0;background:none;padding:10px 13px;font:16px Georgia,serif;color:#6a594c}
.save{border:0;border-radius:999px;background:#51443c;color:#fff5e4;padding:11px 18px;font:16px Georgia,serif}
.memory{font-size:21px;line-height:1.6;text-align:center;white-space:pre-wrap}
.close{display:block;margin:20px auto 0}
.note{color:#f5e4c4;text-align:center;font-size:13px;opacity:.82;margin-top:10px}
</style>
</head>
<body>
<main class="wrap">
<h1>Le cose che non volevo<br>dimenticare</h1>
<p class="subtitle">Piccole cose. Grandi ricordi.</p>

<div class="scene" id="scene">
  <img src="nerini-scene.png" alt="Un barattolo pieno di nerini del buio con piccole stelline">
</div>

<div class="panel">
  <button class="add" id="add">＋ lascia un ricordo</button>
</div>
<div class="count" id="count"></div>
<div class="note">clicca un nerino per aprire ciò che hai scritto</div>
</main>

<dialog id="addDialog"><form class="card" id="addForm">
<h2>Una cosa che non volevo dimenticare…</h2>
<textarea id="text" maxlength="1600" placeholder="Scrivi qui…"></textarea>
<div class="actions"><button type="button" class="cancel" id="cancel">annulla</button><button class="save">♡ conserva</button></div>
</form></dialog>

<dialog id="viewDialog"><div class="card">
<h2>Un piccolo ricordo</h2><div id="memoryText" class="memory"></div>
<button class="save close" id="closeView">chiudi</button>
</div></dialog>

<script>
const KEY="nerini-ricordi-demo";
const memories=JSON.parse(localStorage.getItem(KEY)||"[]");
const scene=document.getElementById("scene"), count=document.getElementById("count");
const addDialog=document.getElementById("addDialog"), viewDialog=document.getElementById("viewDialog"), text=document.getElementById("text");

const positions=["h1","h2","h3","h4","h5","h6","h7","h8"];
function render(){
  scene.querySelectorAll(".hotspot").forEach(x=>x.remove());
  memories.forEach((m,i)=>{
    const b=document.createElement("button");
    b.className="hotspot "+positions[i%positions.length];
    b.setAttribute("aria-label","Apri ricordo");
    b.onclick=()=>{document.getElementById("memoryText").textContent=m;viewDialog.showModal()};
    scene.appendChild(b);
  });
  count.textContent=memories.length?(memories.length===1?"1 ricordo conservato.":memories.length+" ricordi conservati."):"";
}
document.getElementById("add").onclick=()=>{text.value="";addDialog.showModal();setTimeout(()=>text.focus(),100)};
document.getElementById("cancel").onclick=()=>addDialog.close();
document.getElementById("closeView").onclick=()=>viewDialog.close();
document.getElementById("addForm").onsubmit=e=>{
 e.preventDefault(); const v=text.value.trim(); if(!v)return;
 memories.push(v);localStorage.setItem(KEY,JSON.stringify(memories));addDialog.close();render();
};
render();
</script>
</body>
</html>
