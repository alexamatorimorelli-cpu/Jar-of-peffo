<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le cose che non volevo dimenticare</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Courier New",monospace;color:#2e2927}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 18% 15%,#ffe9ad 0 4%,transparent 19%),
    radial-gradient(circle at 83% 23%,#d9a4aa 0 3%,transparent 17%),
    radial-gradient(circle at 52% 58%,#7faeaa 0 2%,transparent 24%),
    linear-gradient(180deg,#182b48 0%,#29465a 32%,#3f6664 60%,#81907b 82%,#c6a47b 100%);
  overflow-x:hidden;
}
.page{min-height:100vh;position:relative;padding:28px 18px 42px;text-align:center}
.paper{
  position:absolute;left:-5%;right:-5%;top:51%;height:38%;
  background:#5c827e;
  opacity:.62;
  transform:rotate(-1deg);
  z-index:0;
  clip-path:polygon(0 7%,4% 5%,8% 8%,13% 4%,18% 7%,24% 3%,30% 7%,36% 4%,43% 7%,50% 3%,58% 6%,64% 4%,71% 7%,77% 3%,84% 6%,91% 4%,100% 7%,100% 93%,95% 91%,90% 94%,83% 91%,76% 95%,69% 92%,62% 95%,55% 91%,48% 94%,40% 91%,33% 95%,26% 92%,19% 94%,12% 91%,5% 94%,0 91%);
}
/* tiny enchanted-forest details */
.ground-details{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.grass{position:absolute;width:3px;height:20px;border-radius:100% 0 100% 0;background:#526b50;transform-origin:bottom}
.g1{left:29%;bottom:15%;transform:rotate(-22deg)}.g2{left:70%;bottom:14%;transform:rotate(25deg)}.g3{left:78%;bottom:17%;height:15px;transform:rotate(-12deg)}
.leaf{position:absolute;width:17px;height:8px;border-radius:100% 0 100% 0;background:#71875e;opacity:.8}
.l1{left:21%;bottom:14%;transform:rotate(25deg)}.l2{right:20%;bottom:12%;transform:rotate(-30deg)}
.mushroom{position:absolute;width:17px;height:13px;border-radius:60% 60% 35% 35%;background:#bd7563;bottom:13%;z-index:2}
.mushroom:after{content:"";position:absolute;width:5px;height:11px;left:6px;top:9px;background:#e8d8b9;border-radius:0 0 4px 4px}
.mushroom i,.mushroom i:before,.mushroom i:after{position:absolute;width:3px;height:3px;border-radius:50%;background:#f2d99e;content:""}
.mushroom i{left:4px;top:4px}.mushroom i:before{left:7px;top:2px}.mushroom i:after{left:3px;top:-2px}
.m1{left:24%;transform:scale(.75)}.m2{right:23%;transform:scale(.55)}
.firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:#f6d77e;box-shadow:0 0 10px #ffe59a;animation:twinkle 3.2s ease-in-out infinite}
.f1{left:24%;bottom:28%}.f2{right:26%;bottom:33%;animation-delay:1.1s}.f3{left:73%;bottom:25%;animation-delay:2s}

/* The Nerini are free: no jar, just little spirits wandering through the night. */
.wander-world{
  position:relative;z-index:3;
  width:min(100%,760px);margin:10px auto 0;
  min-height:620px;overflow:visible;
  isolation:isolate;
}
.nerino{
  position:absolute;width:40px;height:44px;border:0;background:none;padding:0;
  cursor:pointer;filter:drop-shadow(0 3px 5px #101e2744);
  transition:left 6.5s cubic-bezier(.45,.05,.55,.95),top 6.5s cubic-bezier(.45,.05,.55,.95),filter .25s ease;
  animation:spiritBob 4.8s ease-in-out infinite;
  animation-delay:var(--delay,0s);
  z-index:2;
  -webkit-tap-highlight-color:transparent;
}
.nerino:hover,.nerino:focus-visible{
  filter:drop-shadow(0 0 8px #ffe6a8aa) drop-shadow(0 3px 6px #101e2755);
  outline:none;z-index:5;
}
.nerino:hover .star,.nerino:focus-visible .star{
  filter:drop-shadow(0 0 8px #ffe6a8) drop-shadow(0 0 15px #ffe6a855);
}
.nerino svg{width:100%;height:100%;overflow:visible;pointer-events:none}
@keyframes spiritBob{
  0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}
  50%{transform:translateY(-8px) rotate(calc(var(--rot,0deg) + 4deg))}
}
.fur{fill:#111;stroke:#090909;stroke-width:1}
.eye{fill:#fff;stroke:#090909;stroke-width:1}.pupil{fill:#231d1a}
.limb{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.star{stroke:#9b7b45;stroke-width:1;filter:drop-shadow(0 0 5px #ffe3a0)}
.wander-caption{
  position:relative;z-index:3;margin:2px 0 12px;
  color:#f0d28b;font:16px Georgia,serif;text-shadow:0 1px 9px #102b3b99;
}
@media(max-width:420px){
  .page{padding-left:12px;padding-right:12px}
  .wander-world{min-height:640px}
  .nerino{width:36px;height:40px}
  .controls{align-items:center}
}
@media(prefers-reduced-motion:reduce){
  .nerino{animation:none;transition:left 1ms,top 1ms}
  .firefly,.spark,.soot-a,.soot-b,.soot-c{animation:none}
}

.add{
  position:relative;z-index:5;
  border:0;background:#d6a85f;color:#4b302b;
  font:16px "Courier New",monospace;
  padding:11px 20px;box-shadow:2px 3px 0 #a06b45;
  clip-path:polygon(2% 8%,98% 0,100% 90%,3% 100%);
  cursor:pointer;
}
.hint{position:relative;z-index:2;margin:13px 0 0;color:#746b64;font-size:13px}

dialog{
  width:min(460px,92vw);border:0;border-radius:8px;
  background:#fffaf0;color:#3d342f;padding:0;
  box-shadow:0 25px 80px #0005;
}
dialog::backdrop{background:#211b1766}
.card{padding:26px}
.card h2{font-family:Georgia,serif;font-weight:400;margin:0 0 16px;font-size:23px}
textarea{
  width:100%;min-height:170px;border:1px solid #d6c6ae;
  border-radius:5px;background:#fffdf8;padding:13px;
  font:17px/1.5 Georgia,serif;resize:vertical;outline:none;
}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.cancel{border:0;background:none;padding:10px;font:15px "Courier New",monospace}
.save{border:0;background:#d1aa70;padding:10px 16px;font:15px "Courier New",monospace;cursor:pointer}
.memory-text{font:20px/1.6 Georgia,serif;white-space:pre-wrap;text-align:center}
.close{display:block;margin:18px auto 0}
</style>
</head>

<body>
<main class="page">
  <div class="ground-details" aria-hidden="true">
  <span class="grass g1"></span><span class="grass g2"></span><span class="grass g3"></span>
  <span class="leaf l1"></span><span class="leaf l2"></span>
  <span class="mushroom m1"><i></i></span><span class="mushroom m2"><i></i></span>
  <span class="firefly f1"></span><span class="firefly f2"></span><span class="firefly f3"></span>
</div>
<div class="fantasy-sky" aria-hidden="true">
    <span class="fantasy-moon"></span>
    <span class="cloud cloud-a"></span><span class="cloud cloud-b"></span>
    <i class="spark sp1"></i><i class="spark sp2"></i><i class="spark sp3"></i>
    <i class="spark sp4"></i><i class="spark sp5"></i><i class="spark sp6"></i>
    <div class="distant-trees trees-a"></div>
    <div class="distant-trees trees-b"></div>
    <div class="ground-mist"></div>
  </div>
  <div class="paper"></div>

  <h1>Le cose che non volevo<br>dimenticare</h1>
  <div class="subtitle">Piccole cose. Grandi ricordi.</div>

  <div class="controls">
    <button class="control" id="topAdd">＋ lascia un ricordo</button>
    <button class="control" id="viewAll">★ guarda tutti i ricordi</button>
  </div>

  <div class="jar-title">i Nerini in libertà</div>
  <div class="counter" id="counter">nessun ricordo ancora.</div>
  <p class="wander-caption">Piccoli spiritelli, ognuno con una cosa da ricordare.</p>
  <section class="wander-world" id="memories" aria-label="Nerini: tocca uno spiritello per leggere un ricordo"></section>
  <div class="hint">tocca un Nerino per scoprire il suo ricordo</div>
</main>

<dialog id="addDialog">
<form class="card" id="addForm">
  <h2>Una cosa che non volevo dimenticare…</h2>
  <textarea id="text" maxlength="1600" placeholder="Scrivi qui…"></textarea>
  <div class="actions">
    <button type="button" class="cancel" id="cancel">annulla</button>
    <button class="save">★ conserva</button>
  </div>
</form>
</dialog>

<dialog id="viewDialog">
<div class="card">
  <h2>Un piccolo ricordo</h2>
  <div class="memory-text" id="memoryText"></div>
  <div class="actions" style="justify-content:center">
    <button class="cancel" id="deleteMemory">elimina questo ricordo</button>
    <button class="save" id="closeView">chiudi</button>
  </div>
</div>
</dialog>

<dialog id="allDialog">
<div class="card">
  <h2>Tutti i ricordi</h2>
  <div id="allText" class="memory-text"></div>
  <button class="save close" id="closeAll">chiudi</button>
</div>
</dialog>

<script>
const KEY="nerini-demo";
const memories=JSON.parse(localStorage.getItem(KEY)||"[]");
const colors=["#f4c95d","#e8a65b","#d97967","#c96b82","#d9a2bd","#b8a1d9","#91b7c7","#72a9a1","#a8c58b","#d7c46e","#f0d6a0","#e7b6a1","#9caed1","#c48d6a","#e2c38d","#b7c98f","#d49aa2","#8e9fc4"];
let selectedMemoryIndex=-1;

function nerinoSVG(i, memoryText=""){
  let hash=0;
  for(let k=0;k<memoryText.length;k++) hash=((hash<<5)-hash+memoryText.charCodeAt(k))|0;
  const c=colors[Math.abs(hash)%colors.length];
  const q=[
   {fur:"M38 18C31 16 26 21 27 27C20 29 20 36 25 40C20 46 26 53 32 52C36 59 45 57 48 52C56 54 60 47 56 42C62 36 57 29 52 29C51 22 45 18 38 18Z",e1:[32,35],e2:[44,34],star:"M54 17"},
   {fur:"M39 18C32 20 29 24 29 29C22 29 21 36 26 40C22 46 27 52 33 51C35 58 44 59 48 53C55 55 60 49 56 44C62 39 57 32 53 31C53 24 46 18 39 18Z",e1:[32,36],e2:[45,38],star:"M55 18"},
   {fur:"M39 19C32 17 27 22 29 29C22 32 23 38 27 41C23 48 29 53 35 52C39 58 47 56 50 51C57 52 60 45 56 41C60 34 54 29 50 29C49 23 45 19 39 19Z",e1:[32,37],e2:[44,37],star:"M54 15"}
  ][i%3];
  return `<svg viewBox="0 0 68 74">
    <path class="limb" d="M27 43Q17 39 10 31M49 43Q57 37 61 29M31 52Q26 61 20 65M45 52Q50 61 56 64"/>
    <path class="fur" d="${q.fur}"/>
    <circle class="fur" cx="25" cy="25" r="4.5"/><circle class="fur" cx="51" cy="24" r="4.5"/>
    <circle class="fur" cx="31" cy="20" r="3.5"/><circle class="fur" cx="46" cy="19" r="3.5"/>
    <ellipse class="eye" cx="${q.e1[0]}" cy="${q.e1[1]}" rx="5" ry="6.5"/>
    <ellipse class="eye" cx="${q.e2[0]}" cy="${q.e2[1]}" rx="5" ry="6.5"/>
    <circle class="pupil" cx="${q.e1[0]+1}" cy="${q.e1[1]}" r="2"/>
    <circle class="pupil" cx="${q.e2[0]-1}" cy="${q.e2[1]-1}" r="2"/>
    <path class="limb" d="M29 46Q36 50 44 46"/>
    <path class="star" fill="${c}" d="${q.star}l3 6 6.8 .8-5 4.7 1.4 6.5-6.2-3.5-6.2 3.5 1.4-6.5-5-4.7 6.8-.8z"/>
  </svg>`;
}

function render(){
  const box=document.getElementById("memories");
  box.innerHTML="";
  const mobile = window.matchMedia("(max-width: 600px)").matches;
  const worldWidth = Math.max(260, Math.min(box.clientWidth || window.innerWidth-32, 760));
  // Give every Nerino breathing room vertically as the collection grows.
  const rows = Math.max(2, Math.ceil(memories.length / (mobile ? 4 : 7)));
  const worldHeight = Math.max(mobile ? 640 : 620, rows * (mobile ? 190 : 145));
  box.style.height = worldHeight + "px";
  box.style.minHeight = worldHeight + "px";
  const itemW = mobile ? 36 : 40, itemH = mobile ? 40 : 44;
  const minDistance = mobile ? 52 : 56;
  let positions=[];
  let seed=0x5f3759df ^ (memories.length * 2654435761);
  for(const m of memories){
    for(let j=0;j<m.length;j++) seed=(Math.imul(seed ^ m.charCodeAt(j), 16777619))>>>0;
  }
  function rand(){ seed=(Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296; }
  // Random starting points, with a minimum gap so the spirits don't begin on top of one another.
  memories.forEach((m,i)=>{
    let p=null;
    for(let tries=0;tries<1800;tries++){
      const x=8+rand()*Math.max(1,worldWidth-itemW-16);
      const y=12+rand()*Math.max(1,worldHeight-itemH-24);
      if(positions.every(q=>Math.hypot((q.x+itemW/2)-(x+itemW/2),(q.y+itemH/2)-(y+itemH/2))>=minDistance)){
        p={x,y}; break;
      }
    }
    // If the page is crowded, extend the meadow and retry rather than stacking creatures.
    if(!p){
      p={x:8+rand()*Math.max(1,worldWidth-itemW-16),y:worldHeight+60};
    }
    positions.push(p);
  });
  // Keep the wandering field tall enough if an unusually large collection needed extra room.
  const neededHeight=Math.max(worldHeight,...positions.map(p=>p.y+itemH+20));
  box.style.height=neededHeight+"px";
  box.style.minHeight=neededHeight+"px";
  const buttons=[];
  memories.forEach((m,i)=>{
    const b=document.createElement("button");
    b.className="nerino";
    b.setAttribute("aria-label","Apri ricordo "+(i+1));
    b.style.left=positions[i].x+"px";
    b.style.top=positions[i].y+"px";
    const rotations=[-11,7,-4,9,-8,3,12,-6,5,-2];
    b.style.setProperty("--rot",rotations[i%rotations.length]+"deg");
    b.style.setProperty("--delay",((i*.37)%4).toFixed(2)+"s");
    b.innerHTML=nerinoSVG(i,m);
    b.onclick=()=>{
      selectedMemoryIndex=i;
      document.getElementById("memoryText").textContent=m;
      document.getElementById("viewDialog").showModal();
    };
    box.appendChild(b); buttons.push(b);
  });
  // Slow, gentle roaming: each spirit chooses a nearby destination every few seconds.
  function wander(b,index){
    if(!b.isConnected || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const currentX=parseFloat(b.style.left)||0;
    const currentY=parseFloat(b.style.top)||0;
    const w=b.offsetWidth||itemW, h=b.offsetHeight||itemH;
    const maxX=Math.max(8,box.clientWidth-w-8);
    const maxY=Math.max(12,box.clientHeight-h-12);
    let target=null;
    for(let tries=0;tries<90;tries++){
      const nx=Math.max(8,Math.min(maxX,currentX+(rand()-.5)*Math.min(180,worldWidth*.42)));
      const ny=Math.max(12,Math.min(maxY,currentY+(rand()-.5)*Math.min(200,box.clientHeight*.18)));
      const clear=buttons.every(other=>{
        if(other===b)return true;
        const ox=parseFloat(other.style.left)||0, oy=parseFloat(other.style.top)||0;
        return Math.hypot((ox+w/2)-(nx+w/2),(oy+h/2)-(ny+h/2))>=minDistance;
      });
      if(clear){target={x:nx,y:ny};break;}
    }
    if(target){b.style.left=target.x+"px";b.style.top=target.y+"px";}
    const wait=4800+rand()*4200+(index%4)*350;
    b._wanderTimer=setTimeout(()=>wander(b,index),wait);
  }
  buttons.forEach((b,i)=>{b._wanderTimer=setTimeout(()=>wander(b,i),1800+(i%9)*410);});
  const n=memories.length;
  document.getElementById("counter").textContent =
    n===0 ? "nessun ricordo ancora." : n===1 ? "1 ricordo conservato." : n+" ricordi conservati.";
}

function openAdd(){
  document.getElementById("text").value="";
  document.getElementById("addDialog").showModal();
  setTimeout(()=>document.getElementById("text").focus(),80);
}
document.getElementById("topAdd").onclick=openAdd;
document.getElementById("cancel").onclick=()=>document.getElementById("addDialog").close();
document.getElementById("closeView").onclick=()=>document.getElementById("viewDialog").close();
document.getElementById("deleteMemory").onclick=()=>{
  if(selectedMemoryIndex<0)return;
  if(confirm("Sicura di voler eliminare questo ricordo?")){
    memories.splice(selectedMemoryIndex,1);
    localStorage.setItem(KEY,JSON.stringify(memories));
    selectedMemoryIndex=-1;
    document.getElementById("viewDialog").close();
    render();
  }
};
document.getElementById("closeAll").onclick=()=>document.getElementById("allDialog").close();

document.getElementById("addForm").onsubmit=e=>{
  e.preventDefault();
  const v=document.getElementById("text").value.trim();
  if(!v)return;
  memories.push(v);
  localStorage.setItem(KEY,JSON.stringify(memories));
  document.getElementById("addDialog").close();
  render();
};

document.getElementById("viewAll").onclick=()=>{
  const el=document.getElementById("allText");
  el.innerHTML=memories.length
    ? memories.map((m,i)=>`<div style="margin-bottom:18px"><b>★ ${i+1}</b><br>${m.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>`).join("")
    : "Non hai ancora lasciato nessun ricordo.";
  document.getElementById("allDialog").showModal();
};


let resizeTimer;
window.addEventListener("resize",()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(render,250);
});

render();
</script>
</body>
</html>
