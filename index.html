<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le cose che non volevo dimenticare</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif}
body{
  min-height:100vh;overflow-x:hidden;color:#493a32;
  background:
    radial-gradient(circle at 50% 20%,#fff1c94a 0 2px,transparent 3px),
    radial-gradient(circle at 20% 12%,#fff1c933 0 2px,transparent 3px),
    linear-gradient(#15253b 0%,#223950 43%,#5c635e 58%,#b79a78 100%);
}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.09;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:4px 4px}
.sky{position:fixed;inset:0 0 50%;pointer-events:none}
.moon{position:absolute;right:11%;top:7%;width:62px;height:62px;border-radius:50%;background:#fff0c7;box-shadow:0 0 42px #ffe6a655}
.sky i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff1bf;box-shadow:0 0 8px #ffe7a2}
.s1{left:12%;top:18%}.s2{left:29%;top:29%}.s3{left:47%;top:12%}.s4{left:64%;top:25%}.s5{left:79%;top:18%}.s6{left:89%;top:34%}
.hill{position:absolute;bottom:-80px;left:-10%;width:120%;height:165px;background:#29434a;border-radius:50% 50% 0 0/75% 75% 0 0}
.hill2{position:absolute;bottom:-120px;left:-10%;width:120%;height:170px;background:#19343d;border-radius:50% 50% 0 0/75% 75% 0 0}

.wrap{position:relative;min-height:100vh;padding:42px 14px 42px;display:flex;flex-direction:column;align-items:center}
h1{margin:0;color:#fff1d2;text-align:center;font-weight:400;font-size:clamp(31px,8vw,57px);line-height:1.04;text-shadow:0 3px 18px #07101d}
.subtitle{margin:10px 0 24px;color:#f6e5c6;text-align:center;font-size:16px}
.desk{width:min(540px,96vw);position:relative;padding:20px 15px 28px;border-radius:38px;background:linear-gradient(#805f49aa,#523d30aa);box-shadow:0 25px 60px #100b0870}
.jar-shell{position:relative;width:min(390px,88vw);height:515px;margin:auto}
.jar{
 position:absolute;inset:16px 0 0;border:4px solid #ffffffa8;border-top-width:9px;
 border-radius:46px 46px 55px 55px;
 background:linear-gradient(90deg,#ffffff2b,#ffffff08 28%,#ffffff13 58%,#ffffff2b);
 box-shadow:inset 13px 0 25px #fff4,inset -14px 0 24px #25170f16,0 25px 48px #1c120d66;
 overflow:hidden;backdrop-filter:blur(1px)
}
.jar:before{content:"";position:absolute;left:13px;top:24px;width:8px;height:430px;border-radius:9px;background:#ffffff32}
.jar:after{content:"";position:absolute;right:18px;top:65px;width:22px;height:300px;border-radius:50%;background:#ffffff12;transform:rotate(3deg)}
.lid{
 position:absolute;z-index:20;left:8%;top:0;width:84%;height:35px;border-radius:11px;
 background:repeating-linear-gradient(90deg,#7d6d5e 0 4px,#b2a08c 4px 7px);
 box-shadow:0 5px 10px #241912
}
.inner-glow{position:absolute;left:9%;right:9%;bottom:8px;height:85px;border-radius:50%;background:#ffd87528;filter:blur(15px)}
.memories{position:absolute;inset:78px 20px 28px;z-index:10}

.add{
 margin-top:18px;border:1px solid #fff0ce88;border-radius:999px;padding:13px 22px;
 background:#f6e4c1;color:#4b3b31;font:17px Georgia,serif;box-shadow:0 8px 20px #24191266;cursor:pointer
}
.add:hover{background:#fff0d2}
.count{color:#f7e5c7;font-size:14px;margin-top:11px}.tip{color:#f7e5c7;font-size:13px;opacity:.82;margin-top:8px}

/* COMPUTER-GRAPHICS NERINI — organic, hand-drawn silhouettes */
.nerino{
 position:absolute;width:88px;height:94px;border:0;background:none;padding:0;cursor:pointer;
 filter:drop-shadow(0 4px 3px #170e0a44);transition:transform .22s ease,filter .22s ease;
}
.nerino:hover{transform:translateY(-7px) rotate(-4deg) scale(1.07);filter:drop-shadow(0 7px 6px #170e0a55)}
.nerino svg{width:100%;height:100%;overflow:visible}
.nerino .fur{fill:#111;stroke:#090909;stroke-width:1}
.nerino .eye{fill:#fff;stroke:#090909;stroke-width:1}
.nerino .pupil{fill:#241d1a}
.nerino .limb{fill:none;stroke:#111;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.nerino .star{stroke:#9a7436;stroke-width:1;filter:drop-shadow(0 0 4px #ffe59a)}
.n1{left:4%;top:10%;transform:rotate(-7deg)}.n2{left:38%;top:5%;transform:rotate(5deg)}
.n3{left:69%;top:12%;transform:rotate(-4deg)}.n4{left:16%;top:34%;transform:rotate(7deg)}
.n5{left:49%;top:31%;transform:rotate(-6deg)}.n6{left:73%;top:43%;transform:rotate(6deg)}
.n7{left:5%;top:54%;transform:rotate(-4deg)}.n8{left:36%;top:55%;transform:rotate(5deg)}
.n9{left:61%;top:64%;transform:rotate(-7deg)}.n10{left:20%;top:72%;transform:rotate(6deg)}
dialog{width:min(460px,92vw);border:0;border-radius:24px;background:#f8edd8;color:#44362f;padding:0;box-shadow:0 30px 100px #000b}
dialog::backdrop{background:#06101dcc;backdrop-filter:blur(4px)}
.card{padding:27px}.card h2{text-align:center;font-weight:400;margin:0 0 17px;font-size:25px}
textarea{width:100%;min-height:175px;border:1px solid #d4bea0;border-radius:16px;background:#fffaf0;padding:15px;font:18px/1.55 Georgia,serif;color:#44362f;resize:vertical;outline:none}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.cancel{border:0;background:none;padding:10px 13px;font:16px Georgia,serif;color:#6a594d}
.save{border:0;border-radius:999px;background:#50433c;color:#fff6e4;padding:11px 18px;font:16px Georgia,serif}
.memory{font-size:21px;line-height:1.65;text-align:center;white-space:pre-wrap}.close{display:block;margin:20px auto 0}
</style>
</head>
<body>
<div class="sky"><div class="moon"></div><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s5"></i><i class="s6"></i><div class="hill"></div><div class="hill2"></div></div>

<main class="wrap">
<h1>Le cose che non volevo<br>dimenticare</h1>
<p class="subtitle">Piccole cose. Grandi ricordi.</p>

<section class="desk">
 <div class="jar-shell">
  <div class="lid"></div>
  <div class="jar">
   <div class="inner-glow"></div>
   <div id="memories" class="memories"></div>
  </div>
 </div>
</section>

<button class="add" id="add">＋ lascia un ricordo</button>
<div class="count" id="count"></div>
<div class="tip">clicca un nerino per aprire ciò che hai scritto</div>
</main>

<dialog id="addDialog"><form class="card" id="addForm">
<h2>Una cosa che non volevo dimenticare…</h2>
<textarea id="text" maxlength="1600" placeholder="Scrivi qui…"></textarea>
<div class="actions"><button type="button" class="cancel" id="cancel">annulla</button><button class="save">♡ conserva</button></div>
</form></dialog>

<dialog id="viewDialog"><div class="card">
<h2>Un piccolo ricordo</h2><div class="memory" id="memoryText"></div>
<button class="save close" id="closeView">chiudi</button>
</div></dialog>

<script>
const KEY="nerini-demo";
const memories=JSON.parse(localStorage.getItem(KEY)||"[]");
const colors=["#ffe06b","#aeea9b","#f6a6bd","#fff5dc","#a8d7f2","#ffd18b"];

function nerinoSVG(i){
 const c=colors[i%colors.length];
 const poses=[
  {fur:"M44 20 C36 16 27 20 25 29 C20 31 20 39 24 43 C20 49 26 57 34 58 C39 63 48 61 52 56 C60 57 65 50 61 44 C66 38 62 30 56 29 C54 22 49 19 44 20Z",
   e1:[35,36],e2:[47,34], star:"M70 17"},
  {fur:"M43 18 C35 19 31 23 30 29 C23 28 20 35 24 40 C19 45 23 53 30 53 C32 60 40 63 46 58 C53 61 60 56 58 50 C65 46 63 38 57 36 C59 29 52 23 48 24 C47 20 46 19 43 18Z",
   e1:[36,36],e2:[48,38], star:"M67 20"},
  {fur:"M42 19 C34 18 28 23 29 30 C22 32 22 39 27 43 C22 49 28 57 35 56 C40 62 49 59 51 54 C59 55 63 48 59 43 C64 36 58 29 54 29 C53 23 48 19 42 19Z",
   e1:[34,37],e2:[47,39], star:"M69 15"},
  {fur:"M40 21 C32 19 27 25 29 31 C21 34 24 41 29 44 C25 51 31 56 37 55 C40 61 49 60 51 54 C59 54 63 46 57 42 C61 34 54 28 50 29 C49 23 45 20 40 21Z",
   e1:[34,36],e2:[46,35], star:"M68 18"}
 ];
 const q=poses[i%poses.length];
 const flip=i%2?"translate(76 0) scale(-1 1)":"";
 return `<svg viewBox="0 0 82 88" aria-hidden="true">
   <g transform="${flip}">
    <path class="limb" d="M30 48 C21 45 13 39 8 31"/>
    <path class="limb" d="M51 48 C58 43 64 36 68 29"/>
    <path class="limb" d="M34 54 C29 63 24 70 18 73"/>
    <path class="limb" d="M47 54 C52 64 57 69 64 71"/>
    <path class="fur" d="${q.fur}"/>
    <circle class="fur" cx="28" cy="27" r="4.7"/>
    <circle class="fur" cx="57" cy="27" r="4.8"/>
    <circle class="fur" cx="32" cy="22" r="4"/>
    <circle class="fur" cx="52" cy="21" r="4"/>
    <ellipse class="eye" cx="${q.e1[0]}" cy="${q.e1[1]}" rx="5.8" ry="7.5"/>
    <ellipse class="eye" cx="${q.e2[0]}" cy="${q.e2[1]}" rx="5.8" ry="7.5"/>
    <circle class="pupil" cx="${q.e1[0]+1}" cy="${q.e1[1]}" r="2.2"/>
    <circle class="pupil" cx="${q.e2[0]-1}" cy="${q.e2[1]-1}" r="2.2"/>
    <path class="limb" d="M31 49 C38 53 46 53 51 48"/>
    <path class="limb" d="M52 43 C59 38 64 28 68 22"/>
    <path class="limb" d="M53 44 C61 46 66 42 70 36"/>
    <path class="star" fill="${c}" d="${q.star} l3.3 6.8 7.5.9-5.5 5 1.5 7.2-6.8-3.8-6.8 3.8 1.5-7.2-5.5-5 7.5-.9z"/>
   </g>
 </svg>`;
}
function render(){
 const box=document.getElementById("memories");box.innerHTML="";
 memories.forEach((m,i)=>{
  const b=document.createElement("button");b.className="nerino n"+((i%10)+1);b.title="Apri ricordo";b.innerHTML=nerinoSVG(i);
  b.onclick=()=>{document.getElementById("memoryText").textContent=m;document.getElementById("viewDialog").showModal()};
  box.appendChild(b);
 });
 document.getElementById("count").textContent=memories.length?(memories.length===1?"1 ricordo conservato.":memories.length+" ricordi conservati."):"";
}
document.getElementById("add").onclick=()=>{document.getElementById("text").value="";document.getElementById("addDialog").showModal();setTimeout(()=>document.getElementById("text").focus(),80)};
document.getElementById("cancel").onclick=()=>document.getElementById("addDialog").close();
document.getElementById("closeView").onclick=()=>document.getElementById("viewDialog").close();
document.getElementById("addForm").onsubmit=e=>{e.preventDefault();const v=document.getElementById("text").value.trim();if(!v)return;memories.push(v);localStorage.setItem(KEY,JSON.stringify(memories));document.getElementById("addDialog").close();render()};
render();
</script>
</body>
</html>
